  run-autopkgtests:
    name: Run autopkgtests
    needs: build_source_deb
    runs-on: ubuntu-latest

    container:
      image: ubuntu:devel

    steps:
    - name: Prepare container
      run: |
        set -eu

        echo 'APT::Get::Assume-Yes "true";' > /etc/apt/apt.conf.d/90aptyes
        apt update

    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        run-id: ${{ needs.build_source_deb.outputs.run-id }}

    - name: Install dependencies
      run: |
        apt install autopkgtest

    - name: Run autopkgtests
      run: |
        find
        mv ./debian-packages/* .
        mv ./debian-sources/* .
        autopkgtest --apt-pocket proposed --apt-upgrade --no-built-binaries \
          *.deb *.changes -- null
